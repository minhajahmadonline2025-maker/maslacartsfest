<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
  <title>KAMA '26 | MASLAC Arts & Sports Fest</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* --- COLOR THEME & VARIABLES --- */
    :root {
      --bg-color: #F8F6F0;       
      --primary-color: #6A1A21;  
      --secondary-color: #2E4733; 
      --text-main: #1A1A1A;
      --text-muted: #555555;
      --white: #FFFFFF;
      --card-shadow: rgba(0, 0, 0, 0.08);
      
      --font-main: 'Outfit', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      background-color: var(--bg-color);
      font-family: var(--font-main);
      color: var(--text-main);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* --- LOADING SCREEN --- */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
    }
    
    .loader-logo {
      width: 100px;
      height: auto;
      animation: pulseLogo 1.5s infinite alternate;
    }

    .loader-text {
      margin-top: 15px;
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--primary-color);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
    }

    @keyframes pulseLogo {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* --- MAIN CONTENT CONTAINER --- */
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 4rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .app-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- HEADER SECTION --- */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
      width: 100%;
    }

    .main-logo {
      width: 150px;
      height: auto;
      margin-bottom: 1rem;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.1));
      transition: transform 0.3s ease;
    }

    .fest-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--primary-color);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
    }

    .fest-subtitle {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* --- CHEST NUMBER DISPLAY --- */
    .chest-display {
      background: var(--white);
      border-radius: 16px;
      padding: 1.5rem 4rem;
      margin-bottom: 3rem;
      text-align: center;
      box-shadow: 0 15px 30px var(--card-shadow);
      border: 1px solid rgba(0,0,0,0.03);
      display: none;
      position: relative;
      overflow: hidden;
    }
    
    .chest-display::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
    }

    .chest-display.visible {
      display: block;
      animation: slideUp 0.6s ease forwards;
    }

    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .chest-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .chest-number {
      font-family: var(--font-display);
      font-size: 3rem;
      color: var(--text-main);
      font-weight: 800;
      letter-spacing: 1px;
    }

    /* --- PORTAL CARDS --- */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      width: 100%;
    }

    .portal-card {
      text-decoration: none;
      border-radius: 20px;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      z-index: 1;
    }

    .portal-card:hover {
      transform: translateY(-8px);
    }

    /* Sports Theme */
    .card-sports {
      background: var(--secondary-color);
      color: var(--white);
      box-shadow: 0 12px 25px rgba(46, 71, 51, 0.25);
    }
    .card-sports .portal-btn { color: var(--secondary-color); }

    /* Arts Theme */
    .card-arts {
      background: var(--primary-color);
      color: var(--white);
      box-shadow: 0 12px 25px rgba(106, 26, 33, 0.25);
    }
    .card-arts .portal-btn { color: var(--primary-color); }

    .card-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }

    .portal-card:hover .card-icon {
      transform: scale(1.15) rotate(5deg);
    }

    .portal-card h2 {
      font-family: var(--font-display);
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .portal-card p {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 2rem;
      letter-spacing: 0.5px;
    }

    .portal-btn {
      background: var(--white);
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .portal-card:hover .portal-btn {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    /* --- FOOTER --- */
    .footer {
      margin-top: 4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      text-align: center;
    }

    /* ========================================= */
    /* 📱 RESPONSIVE DESIGN FOR MOBILE DEVICES  */
    /* ========================================= */
    @media (max-width: 600px) {
      .app-container {
        padding: 2.5rem 1rem; /* Reduced padding on mobile */
      }
      
      .main-logo {
        width: 110px; /* Smaller logo */
      }

      .fest-title {
        font-size: 1.8rem; /* Smaller main heading */
      }
      
      .chest-display {
        padding: 1.2rem 1.5rem; /* Smaller padding for chest box */
        margin-bottom: 2rem;
      }

      .chest-number {
        font-size: 2.2rem; /* Smaller chest number */
      }

      .cards-grid {
        grid-template-columns: 1fr; /* Stack cards vertically */
        gap: 1rem; /* Reduced gap between cards */
      }

      .portal-card {
        padding: 1.8rem 1rem; /* Much smaller box padding on mobile */
        border-radius: 16px;
      }

      .card-icon {
        font-size: 2.8rem; /* Smaller icons inside box */
        margin-bottom: 0.5rem;
      }

      .portal-card h2 {
        font-size: 1.6rem; /* Smaller box title */
      }

      .portal-card p {
        font-size: 0.85rem; /* Smaller subtitle */
        margin-bottom: 1.2rem;
      }

      .portal-btn {
        padding: 10px 20px; /* Smaller button */
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div id="loader">
    <img src="kamapng.png" alt="Loading Logo" class="loader-logo" onerror="this.style.display='none'">
    <div class="loader-text">Initializing</div>
  </div>

  <div class="app-container" id="mainApp">
    
    <header class="header">
      <img src="kamapng.png" alt="Maslac Arts Fest Logo" class="main-logo" onerror="this.alt='Logo Image Missing'">
      <h1 class="fest-title">Maslac Arts Fest '26</h1>
      <p class="fest-subtitle">Malik Deenar Islamic Academy</p>
    </header>

    <div class="chest-display" id="chestBox">
      <div class="chest-label">Candidate Identifier</div>
      <div class="chest-number" id="chestNum">—</div>
    </div>

    <div class="cards-grid">
      <a href="https://kamasports.festie.app" class="portal-card card-sports" id="sportsCard">
        <div class="card-icon">🏆</div>
        <h2>Sports</h2>
        <p>Enter the Arena</p>
        <span class="portal-btn">Open Portal</span>
      </a>

      <a href="https://kama.festie.app" class="portal-card card-arts" id="artsCard">
        <div class="card-icon">🎭</div>
        <h2>Arts</h2>
        <p>Explore the Stage</p>
        <span class="portal-btn">Open Portal</span>
      </a>
    </div>

    <footer class="footer">
      MASLAC • System Authenticated
    </footer>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Remove Loader smoothly after 1.8 seconds
      setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('mainApp').classList.add('visible');
      }, 1800);

      // Fetch Chest Number from URL
      const path = window.location.pathname.replace(/^\//, '').trim();
      const params = new URLSearchParams(window.location.search);
      let queryId = params.get('id') || params.get('chest');
      let chestNo = path ? path : queryId;

      if (chestNo && chestNo.length > 0) {
        chestNo = chestNo.toUpperCase();

        const box = document.getElementById('chestBox');
        const num = document.getElementById('chestNum');
        num.textContent = chestNo;
        box.classList.add('visible');

        const sportsCard = document.getElementById('sportsCard');
        sportsCard.href = `https://kamasports.festie.app/results/candidates/${chestNo}`;

        const artsCard = document.getElementById('artsCard');
        artsCard.href = `https://kama.festie.app/results/candidates/${chestNo}`;

        window.history.replaceState({}, document.title, "/");
      }
    });
  </script>
</body>
</html>
